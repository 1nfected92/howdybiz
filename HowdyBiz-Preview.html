function assess(b) {
  if (!b.website) return { score: 'Potential', explanation: 'No website is listed in the current source. Confirm with the owner before proposing a new site.' };

}
function matches(b, f = {}) {
  const hay = [b.name, b.category, b.address, b.zip, b.email].join(' ').toLowerCase();
  return (!f.text || hay.includes(f.text.toLowerCase())) && (!f.category || b.category === f.category) && (!f.score || b.score === f.score) && (!f.stage || b.stage === f.stage) && (!f.website || b.website_status === f.website) && (!f.rating || Number(b.rating) >= Number(f.rating));
}

  const map = new Map(previous.map(b => [b.place_id || b.id, b]));
  for (const b of incoming) {
    const key = b.place_id || b.id, old = map.get(key);
    map.set(key, old ? { ...old, ...b, id: old.id, stage: old.stage, score: old.score, explanation: old.explanation, notes: old.notes, tasks: old.tasks, activity: old.activity, proposals: old.proposals, payments: old.payments } : b);

const remote=(()=>{
const localStore=safeStorage('localStorage'),sessionStore=safeStorage('sessionStorage');
let configuration = {}, session = null;
let refreshFlight;
async function initialize() {
  const stored = JSON.parse(localStore.getItem('howdybiz.connection') || '{}');
  const r = await fetch('./config.json').catch(() => null);
  configuration = { ...(r?.ok ? await r.json() : {}), ...stored };
  session = JSON.parse(sessionStore.getItem('howdybiz.auth') || 'null');
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('access_token')) {
    session = { access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_at:Date.now()+Number(hash.get('expires_in')||3600)*1000 };
    sessionStore.setItem('howdybiz.auth', JSON.stringify(session));
    history.replaceState(null,'',location.pathname+location.search);
  }
  return configuration;
}
function configured() { return Boolean(configuration.supabaseUrl && configuration.publishableKey); }
function getConfig() { return configuration; }
function saveConnection(url,key) {
  const parsed=new URL(url);
  if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.supabase.co')) throw Error('Use an HTTPS Supabase project URL.');
  if (!key.startsWith('sb_publishable_')) { try { const payload=JSON.parse(atob(key.split('.')[1])); if(payload.role!=='anon')throw Error(); } catch { throw Error('Use only a publishable or legacy anon key.'); } }
  configuration={supabaseUrl:parsed.origin,publishableKey:key};localStore.setItem('howdybiz.connection',JSON.stringify(configuration));
}
async function authenticate(email) {
  if(!configured())throw Error('Configure Supabase first.');
  await request('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:{email,create_user:true}},false);
}
async function logout(){ if(session)await request('/auth/v1/logout',{method:'POST'}).catch(()=>{});session=null;sessionStore.removeItem('howdybiz.auth'); }
async function refresh(){
  if(!session?.refresh_token)throw Error('Sign in to continue.');
  if(!refreshFlight)refreshFlight=request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}},false).then(s=>{session={...s,expires_at:Date.now()+s.expires_in*1000};sessionStore.setItem('howdybiz.auth',JSON.stringify(session));}).finally(()=>refreshFlight=null);
  return refreshFlight;
}
async function request(path,options={},authorized=true){
  if(!configured())throw Error('Backend not configured. Open Integrations to connect Supabase.');
  if(authorized&&session?.expires_at&&session.expires_at<Date.now()+30000)await refresh();
  const r=await fetch(configuration.supabaseUrl+path,{method:options.method||'GET',headers:{apikey:configuration.publishableKey,'Content-Type':'application/json',...(authorized&&session?{Authorization:`Bearer ${session.access_token}`}:{})},body:options.body?JSON.stringify(options.body):undefined});
  const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error?.message||data.error||data.msg||data.message||`Request failed (${r.status})`);return data;
}
async function user(){ if(!session)return null;return request('/auth/v1/user'); }
function api(action,body={}){ if(!session)throw Error('Sign in before using live integrations.');return request('/functions/v1/api',{method:'POST',body:{action,...body}}); }

return {initialize,configured,getConfig,saveConnection,authenticate,logout,user,api};})();

function renderTable(){const list=currentRecords().filter(b=>qualified(b)&&matches(b,state.filters));list.sort((a,b)=>{const x=a[state.sort]??'',y=b[state.sort]??'';return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*state.direction;});const max=Math.max(1,Math.ceil(list.length/8));state.page=Math.min(state.page,max);$('#result-count').textContent=list.length;const page=list.slice((state.page-1)*8,state.page*8);

fied matches':'Your next client is out there.'}</h3><p>${currentRecords().length?'Adjust filters or review the enrichment queue.':'Run a connected Google search, or load fictional samples to explore the workspace.'}</p></div>`;
  $('[data-sort]')&&document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.direction=state.sort===b.dataset.sort?-state.direction:1;state.sort=b.dataset.sort;renderTable();});

n class="service-mark github">⌘</span><h2>GitHub Pages</h2><p>Free static frontend deployment at your project path.</p>${tag('Deployment pending')}<p class="small">The source includes a Pages workflow. Enable GitHub Actions as the Pages source in the howdybiz repository.</p><a href="https://github.com/1nfected92" target="_blank" rel="noopener noreferrer" class="secondary">Open GitHub ↗</a></section></div>`;

  $('#import-live',d)?.addEventListener('click',()=>confirmModal('Import selected lead?','Copy this non-sample business into production. Existing production notes and outreach history will be preserved.',async()=>{await remote.api('import',{business:b,revision:state.revision});notify('Lead imported into production.');}));
}
function prepareEmail(b){const draft=b.draft||emailDraft(b);const d=modal('Prepare email',`<div class="notice">${state.mode==='demo'?'DEMO: actual recipient is your backend-verified Gmail. Subject is exactly TEST.':'LIVE: the reviewed email will go to the selected business contact.'}</div><p class="small">Intended business: ${e(b.name)} · ${e(b.email||'Missing email')}</p><form id="email-form"><label>Original proposed subject<input name="subject" value="${e(draft.subject)}" required maxlength="180"></label><label>Email body<textarea name="body" rows="12" required maxlength="20000">${e(draft.body)}</textarea></label><div class="modal-actions"><button type="button" class="secondary" id="save-draft">Save draft</button><button class="primary">Review actual send →</button></div></form>`,true);
  const fields=()=>Object.fromEntries(new FormData($('#email-form',d)));
  $('#save-draft',d).onclick=()=>run(async()=>{await update(b,{draft:fields()},'Email draft saved','No email sent.');notify('Draft saved.');});
  $('#email-form',d).onsubmit=ev=>{ev.preventDefault();run(async()=>{const original=fields();if(!qualified(b))throw Error('Both phone and email are required.');if(b.stage==='Do Not Contact')throw Error('Business is marked Do Not Contact.');const ticket=await remote.api('preview',{business:b,draft:original,revision:state.revision});const review=modal('Review & send',`<div class="send-envelope"><span class="mode-label">${e(ticket.mode.toUpperCase())}</span><p><b>To:</b> ${e(ticket.to)}</p><p><b>Subject:</b> ${e(ticket.subject)}</p><p><b>CC / BCC:</b> None</p></div><pre class="email-preview">${e(ticket.body)}</pre><p class="small">Preview expires in five minutes. Switching mode invalidates it. Clicking Send sends a real email.</p><button id="send-email" class="primary">Send ${ticket.mode==='demo'?'TEST to myself':'reviewed email'}</button>`,true);$('#send-email',review).onclick=()=>run(async()=>{const button=$('#send-email',review);button.disabled=true;try{const r=await remote.api('send',{ticket_id:ticket.id,revision:state.revision});await update(b,{draft:original,...(state.mode==='live'?{stage:'Contacted'}:{})},'Email sent',`${state.mode==='demo'?'TEST to verified owner':'Outreach'} · Gmail accepted message ${r.message_id}`);closeModal();render();notify('Gmail accepted the message. Delivery is not confirmed.');}catch(err){button.disabled=true;throw err;}});});};
}
function proposalForm(b,existing){const p=existing||{title:`Website & automation proposal for ${b.name}`,scope:'',deliverables:'',timeline:'',terms:'',amount:0,status:'Draft',due:''};const d=modal(existing?'Revise proposal / quote':'Prepare proposal / quote',`<form id="proposal-form"><div class="form-grid"><label class="full">Title<input name="title" value="${e(p.title)}" required maxlength="200"></label><label class="full">Scope<textarea name="scope" rows="3" required maxlength="10000">${e(p.scope)}</textarea></label><label class="full">Deliverables<textarea name="deliverables" rows="3" required maxlength="10000">${e(p.deliverables)}</textarea></label><label>Timeline<input name="timeline" value="${e(p.timeline)}" required maxlength="300"></label><label>Quote amount (USD)<input name="amount" type="number" min="0" max="1000000" step="0.01" value="${e(p.amount)}" required></label><label>Status<select name="status">${options(PROPOSAL_STATES,p.status)}</select></label><label>Due / expiry date<input name="due" type="date" value="${e(p.due)}"></label><label class="full">Related documents (public or signed URLs, one per line)<textarea name="documents" rows="2" maxlength="5000">${e(p.documents||'')}</textarea></label><label class="full">Payment terms<textarea name="terms" rows="2" required maxlength="5000">${e(p.terms)}</textarea></label></div><p class="small">Saving a proposal does not email it. Revisions preserve earlier versions.</p><button class="primary">Save ${existing?'new version':'proposal'}</button></form>`,true);$('#proposal-form',d).onsubmit=ev=>{ev.preventDefault();run(async()=>{const v=Object.fromEntries(new FormData(ev.target));const proposals=[...(b.proposals||[]),{...v,amount:Number(v.amount),id:crypto.randomUUID(),series:existing?.series||existing?.id||crypto.randomUUID(),version:(existing?.version||0)+1,created_at:new Date().toISOString()}];await update(b,{proposals},'Proposal saved',`${v.title} · ${money(v.amount)} · ${v.status}`);closeModal();render();notify('Proposal saved.');});};}
function paymentForm(b){const d=modal('Record payment',`<form id="payment-form"><div class="form-grid"><label>Amount (USD)<input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></label><label>Status<select name="status">${options(PAYMENT_STATES,'Paid')}</select></label><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Reference<input name="reference" maxlength="200"></label></div><p class="small">This is a manual record. No payment is charged or confirmed by a payment provider.</p><button class="primary">Save payment record</button></form>`);$('#payment-form',d).onsubmit=ev=>{ev.preventDefault();run(async()=>{const p=Object.fromEntries(new FormData(ev.target));p.amount=Number(p.amount);await update(b,{payments:[...(b.payments||[]),{...p,id:crypto.randomUUID(),source:'manual'}]},'Payment recorded',`${money(p.amount)} · ${p.status} · manual entry`);closeModal();render();notify('Manual payment recorded.');});};}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-open]');if(b)openBusiness(b.dataset.open);});
await remote.initialize();state.records=demoRecords();if(localStore.getItem('howdybiz.theme')==='dark')document.documentElement.classList.add('dark');
try{state.user=await remote.user();if(state.user)await loadLive();}catch(err){notify(err.message,true);}
const status=new URLSearchParams(location.search).get('gmail');if(status){notify(status==='connected'?'Gmail connected.':'Gmail connection failed. Review configuration.',status!=='connected');history.replaceState(null,'',location.pathname);}
render();

if(!state.records.length){state.records=samples();storeDemo();render();}</script></body></html>
